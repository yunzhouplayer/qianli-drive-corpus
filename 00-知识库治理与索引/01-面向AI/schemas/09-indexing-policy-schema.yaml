# 用途：校验稳定的分块、写入、生命周期、证据和索引版本原则；可调参数由独立实现配置定义。
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:qianli-drive:knowledge:indexing-policy:v1
title: 千里智行知识索引稳定策略
type: object
additionalProperties: false
required: [$schema, schema_version, policy_id, state_ref, implementation_status, implementation_profile_path_scope, implementation_profile_ref, implementation_profile_schema_ref, missing_implementation_profile_action, chunking, write_semantics, lifecycle, retrieval, versioning]
properties:
  $schema: {type: string, const: ./schemas/09-indexing-policy-schema.yaml, description: 当前文件使用的项目内 Schema 路径。}
  schema_version: {type: string, const: "1.0", description: 索引稳定策略结构版本。}
  policy_id: {type: string, pattern: '^[a-z][a-z0-9-]+$', description: 索引策略稳定 ID。}
  state_ref: {type: string, const: 00-ai-control-manifest.yaml, description: 全局运行模式和生产开关的唯一机器来源。}
  implementation_status: {type: string, enum: [contract_only, implemented, validated], description: 稳定策略的实现和验证状态。}
  implementation_profile_path_scope: {type: string, const: governance_root, description: 实现配置路径相对于知识治理根目录解析。}
  implementation_profile_ref: {type: string, const: 03-平台运维/configs/governance-validation-indexing-profile.yaml, description: 治理验证索引参数配置的受控相对路径；当前阶段允许尚未创建。}
  implementation_profile_schema_ref: {type: string, const: 01-面向AI/schemas/17-indexing-profile-schema.yaml, description: 相对于知识治理根目录的实现配置 Schema 路径。}
  missing_implementation_profile_action: {type: string, const: deny_production_enablement, description: 实现配置缺失时禁止启用生产索引。}
  chunking:
    type: object
    additionalProperties: false
    description: 不依赖具体 Tokenizer 或数值参数的稳定分块语义。
    required: [strategy, chunk_id_components, preserve_blocks, unsupported_content_action, images, attachments]
    properties:
      strategy: {type: string, const: heading_aware, description: 按标题层级感知边界的分块策略。}
      chunk_id_components: {$ref: '#/$defs/nonempty_unique_strings', description: 稳定 chunk ID 的组成字段。}
      preserve_blocks: {$ref: '#/$defs/nonempty_unique_strings', description: 优先保持原子性的内容块。}
      unsupported_content_action: {type: string, const: reject_with_reason, description: 无法解析内容必须拒绝并记录原因。}
      images:
        type: object
        additionalProperties: false
        description: 图片内容形成可检索知识前必须满足的人工确认要求。
        required: [require_human_verified_description]
        properties:
          require_human_verified_description: {type: boolean, const: true, description: 图片知识进入索引前需人工确认描述。}
      attachments:
        type: object
        additionalProperties: false
        description: 附件内容必须独立登记且禁止未经批准递归索引。
        required: [recursive_indexing_allowed, require_independent_metadata]
        properties:
          recursive_indexing_allowed: {type: boolean, const: false, description: 禁止未经登记递归索引附件。}
          require_independent_metadata: {type: boolean, const: true, description: 附件需独立元数据和权限判断。}
  write_semantics:
    type: object
    additionalProperties: false
    description: 索引写入必须满足的哈希、幂等、游标、失败处理和原子性原则。
    required: [content_hash_algorithm, idempotency_key_components, event_deduplication_required, source_cursor_required, exhausted_retry_action, partial_document_commit_allowed]
    properties:
      content_hash_algorithm: {type: string, const: sha256, description: 内容哈希算法。}
      idempotency_key_components: {$ref: '#/$defs/nonempty_unique_strings', description: 幂等键组成字段。}
      event_deduplication_required: {type: boolean, const: true, description: 同步事件必须去重。}
      source_cursor_required: {type: boolean, const: true, description: 增量同步必须记录可恢复源游标。}
      exhausted_retry_action: {type: string, const: dead_letter_and_alert, description: 配置的重试次数耗尽后进入死信并告警。}
      partial_document_commit_allowed: {type: boolean, const: false, description: 禁止提交部分文档分块。}
  lifecycle:
    type: object
    additionalProperties: false
    description: 文档更新、权限变化、废弃、删除和来源缺失时的稳定失效策略。
    required: [update_strategy, permission_change_strategy, deprecation_strategy, deletion_strategy, source_missing_action]
    properties:
      update_strategy: {type: string, const: replace_document_generation_atomically, description: 更新按文档 generation 原子替换。}
      permission_change_strategy: {type: string, const: invalidate_then_rebuild, description: 权限变化先失效再重建。}
      deprecation_strategy: {type: string, const: remove_from_active_retrieval, description: 废弃文档移出有效检索。}
      deletion_strategy: {type: string, const: tombstone_then_delete, description: 删除先写墓碑再按实现配置清理。}
      source_missing_action: {type: string, const: deny_retrieval_and_alert, description: 源缺失时停止召回并告警。}
  retrieval:
    type: object
    additionalProperties: false
    description: 混合检索必须遵守的权威证据和无证据拒答原则。
    required: [strategy, minimum_evidence_policy, below_threshold_action]
    properties:
      strategy: {type: string, const: hybrid, description: 关键词与向量混合检索；算法、权重和模型由实现配置定义。}
      minimum_evidence_policy: {type: string, const: at_least_one_accessible_authoritative_source, description: 至少需要一个调用方可访问的权威来源。}
      below_threshold_action: {type: string, const: return_no_evidence, description: 低于实现配置的证据阈值时返回无证据。}
  versioning:
    type: object
    additionalProperties: false
    description: 索引 generation 发布、评测、原子切换和回滚的稳定控制。
    required: [policy_version, generation_format, evaluation_gate_required, atomic_alias_switch_required, rollback_generation_required, rollback_when]
    properties:
      policy_version: {type: string, minLength: 1, description: 参与幂等键和评测记录的策略版本。}
      generation_format: {type: string, const: timestamp_contenthash, description: 索引 generation 格式。}
      evaluation_gate_required: {type: boolean, const: true, description: 发布前必须通过评测门禁。}
      atomic_alias_switch_required: {type: boolean, const: true, description: generation 切换必须原子执行。}
      rollback_generation_required: {type: boolean, const: true, description: 必须保留可回滚 generation。}
      rollback_when: {$ref: '#/$defs/nonempty_unique_strings', description: 强制回滚触发条件。}
$defs:
  nonempty_unique_strings:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
