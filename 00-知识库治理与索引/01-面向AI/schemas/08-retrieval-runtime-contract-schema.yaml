# 用途：校验检索运行契约的身份、ACL、证据和安全语义；请求、响应和错误字段由其独立 Schema 定义。
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:qianli-drive:knowledge:retrieval-runtime-contract:v1
title: 千里智行知识检索运行契约
type: object
additionalProperties: false
required: [$schema, schema_version, contract_id, state_ref, implementation_status, transport_binding, request_schema_ref, response_schema_ref, acl_decision_schema_ref, identity_rules, permission_checks, answer_rules]
properties:
  $schema: {type: string, const: ./schemas/08-retrieval-runtime-contract-schema.yaml, description: 当前文件使用的项目内 Schema 路径。}
  schema_version: {type: string, const: "1.0", description: 检索契约版本。}
  contract_id: {type: string, pattern: '^[a-z][a-z0-9-]+$', description: 检索契约稳定 ID。}
  state_ref: {type: string, const: 00-ai-control-manifest.yaml, description: 全局运行模式和生产开关的唯一机器来源。}
  implementation_status: {type: string, enum: [contract_only, implemented, validated], description: 契约实现状态。}
  transport_binding: {type: string, enum: [transport_agnostic, mcp, http], description: 协议绑定；当前保持与传输无关。}
  request_schema_ref: {type: string, const: schemas/15-retrieval-request-schema.yaml, description: 实际查询请求载荷的唯一字段 Schema。}
  response_schema_ref: {type: string, const: schemas/16-retrieval-response-schema.yaml, description: 实际响应、引用和公共错误载荷的唯一字段 Schema。}
  acl_decision_schema_ref: {type: string, const: schemas/14-acl-decision-schema.yaml, description: 实际 ACL 判定载荷 Schema。}
  identity_rules:
    type: object
    additionalProperties: false
    description: 所有检索适配器必须共同遵守的身份安全规则。
    required: [anonymous_allowed, plaintext_personal_data_allowed, stale_identity_action]
    properties:
      anonymous_allowed: {type: boolean, const: false, description: 不允许匿名访问公司知识。}
      plaintext_personal_data_allowed: {type: boolean, const: false, description: 不在请求审计中保存明文个人信息。}
      stale_identity_action: {type: string, const: deny_access, description: 身份快照过期时拒绝访问。}
  permission_checks:
    type: object
    additionalProperties: false
    description: 检索前、读取前和回答前三个不可跳过的源权限检查阶段。
    required: [pre_retrieval, pre_document_read, pre_answer, unknown_or_unavailable_acl, deny_precedence, inheritance_source]
    properties:
      pre_retrieval: {$ref: '#/$defs/permission_stage', description: 召回前权限过滤。}
      pre_document_read: {$ref: '#/$defs/permission_stage', description: 读取源文档前二次鉴权。}
      pre_answer: {$ref: '#/$defs/permission_stage', description: 输出回答前引用鉴权。}
      unknown_or_unavailable_acl: {type: string, const: deny_access, description: ACL 不可用时拒绝。}
      deny_precedence: {type: string, const: explicit_deny_overrides_allow, description: 显式拒绝优先于允许。}
      inheritance_source: {type: string, const: source_knowledge_base, description: 权限继承以源知识库为准。}
  answer_rules:
    type: object
    additionalProperties: false
    description: 回答必须具备可访问证据且不得泄露未授权资源的安全不变量。
    required: [evidence_required, accessible_citation_required, stale_source_allowed, permission_filtered_count_exposed, unauthorized_resource_existence_exposed]
    properties:
      evidence_required: {type: boolean, const: true, description: 回答必须具有证据。}
      accessible_citation_required: {type: boolean, const: true, description: 回答必须提供调用方可访问的引用。}
      stale_source_allowed: {type: boolean, const: false, description: 禁止使用过期来源回答。}
      permission_filtered_count_exposed: {type: boolean, const: false, description: 不暴露被权限过滤的命中数量。}
      unauthorized_resource_existence_exposed: {type: boolean, const: false, description: 不暴露未授权资源存在性。}
$defs:
  permission_stage:
    type: object
    additionalProperties: false
    required: [required, action]
    properties:
      required: {type: boolean, const: true, description: 该权限检查不得跳过。}
      action: {type: string, minLength: 1, description: 稳定权限动作编码。}
