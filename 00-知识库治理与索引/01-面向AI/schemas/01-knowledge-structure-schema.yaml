# 用途：校验 01-knowledge-structure.yaml v2 的空间、目录路径段和显式配置档引用。
# 说明：完整路径由父节点递归生成；稳定 ID、路径唯一性、父子循环和本地目录存在性由平台运维校验器检查。
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:qianli-drive:knowledge:structure:v2
title: 千里智行公司知识库机器蓝图 v2
description: 通过七类显式目录配置档减少重复字段，同时保留空间责任、稳定ID和全部目录控制语义。
type: object
additionalProperties: false

required:
  - schema_version
  - updated_at
  - source_human_blueprint
  - directory_profiles
  - spaces

properties:
  schema_version:
    type: string
    const: "2.0"
    description: 当前紧凑结构版本。
  updated_at:
    type: string
    format: date
    description: 蓝图最后更新日期，使用 YYYY-MM-DD。
  source_human_blueprint:
    type: string
    minLength: 1
    description: 人员可读目录蓝图的项目内相对路径。
  directory_profiles:
    type: object
    minProperties: 1
    description: 目录控制属性的显式配置档；目录必须逐项引用，不使用隐含默认值。
    additionalProperties:
      $ref: "#/$defs/directory_profile"
  spaces:
    type: array
    minItems: 1
    description: 公司知识空间列表。
    items:
      $ref: "#/$defs/space"

$defs:
  nullable_person:
    description: 未任命时为 null，任命后填写稳定人员标识。
    oneOf:
      - type: string
        minLength: 1
      - type: "null"

  owners:
    type: object
    additionalProperties: false
    description: 空间主管理员和备用管理员。
    required: [primary, backup]
    properties:
      primary:
        $ref: "#/$defs/nullable_person"
        description: 空间主管理员；当前以飞书通讯录姓名标识。
      backup:
        $ref: "#/$defs/nullable_person"
        description: 空间备用管理员；未任命时为 null。

  directory_profile:
    type: object
    additionalProperties: false
    description: 一组不可隐式继承的目录控制属性。
    required: [kind, access_policy, index_policy, active_knowledge_allowed, status]
    properties:
      kind:
        type: string
        enum: [governance, content, archive, project_template]
        description: 目录类型：治理、业务内容、归档或项目模板。
      access_policy:
        type: string
        enum: [inherit, restricted, strictly_restricted]
        description: 访问策略：继承、按目录授权或严格限制授权。
      index_policy:
        type: string
        enum: [evaluate_document_rules, require_explicit_approval, deny]
        description: 索引策略：继续校验文档规则、专项审批或禁止。
      active_knowledge_allowed:
        type: boolean
        description: 是否允许目录内容作为当前有效知识。
      status:
        type: string
        enum: [active, planned, deprecated]
        description: 目录生命周期状态。

  space:
    type: object
    additionalProperties: false
    required:
      - space_id
      - path_segment
      - purpose
      - owners
      - default_access
      - security_default
      - acl_inheritance
      - default_index_policy
      - status
      - directories
    properties:
      space_id:
        type: string
        pattern: "^SPACE-[A-Z0-9-]+$"
        description: 不随显示名称变化的稳定空间标识。
      path_segment:
        type: string
        pattern: "^[^/\\\\]+$"
        minLength: 1
        description: 空间物理路径段；也是未另设展示名时的默认人读名称。
      display_name:
        type: string
        minLength: 1
        description: 可选中文展示名，不改变飞书物理名称或生成路径。
      purpose:
        type: string
        minLength: 1
        description: 空间承载范围和治理定位。
      owners:
        $ref: "#/$defs/owners"
        description: 空间的主备管理员。
      default_access:
        type: string
        enum: [governance_team_managed, public_read_with_restricted_exceptions, center_read_comment, department_read_comment, project_members_only]
        description: 空间默认访问方式。
      security_default:
        description: 未确认空间默认安全等级时保持 null。
        oneOf:
          - type: string
            enum: [public, internal, confidential, restricted]
          - type: "null"
      acl_inheritance:
        type: boolean
        description: 子目录是否默认继承父级 ACL。
      default_index_policy:
        type: string
        enum: [evaluate_document_rules, require_explicit_approval, deny]
        description: 空间默认索引策略。
      status:
        type: string
        enum: [active, planned, deprecated]
        description: 空间生命周期状态。
      directories:
        type: array
        description: 空间内登记的目录列表。
        items:
          $ref: "#/$defs/directory"

  directory:
    type: object
    additionalProperties: false
    required: [directory_id, path_segment, parent_directory_id, profile_ref]
    properties:
      directory_id:
        type: string
        pattern: "^DIR-[0-9]{2}-[0-9]{3}$"
        description: 稳定目录标识；新增目录使用未占用编号，不重排已有编号。
      path_segment:
        type: string
        pattern: "^[^/\\\\]+$"
        minLength: 1
        description: 目录物理路径段；与父节点递归生成完整路径。
      display_name:
        type: string
        minLength: 1
        description: 可选中文展示名；可去除物理名称中的权限说明后缀，但不改变路径。
      parent_directory_id:
        description: 直属空间根目录时为 null，否则填写同空间父目录稳定ID。
        oneOf:
          - type: string
            pattern: "^DIR-[0-9]{2}-[0-9]{3}$"
          - type: "null"
      profile_ref:
        type: string
        minLength: 1
        description: 必须显式引用 directory_profiles 中的一个配置档。
      notes:
        type: string
        minLength: 1
        description: 对目录边界、例外或使用限制的中文补充说明。
