# 用途：冻结本地 AI、MCP 或 HTTP 适配器共同遵守的检索请求、权限、结果和错误语义。
# 边界：本文件不表示任何检索服务已部署；当前只用于治理验证和实现验收。
$schema: ./schemas/08-retrieval-runtime-contract-schema.yaml
schema_version: "1.0"
contract_id: qianli-knowledge-retrieval
operating_mode: governance_validation
implementation_status: contract_only
transport_binding: transport_agnostic
request_schema_ref: schemas/15-retrieval-request-schema.yaml
response_schema_ref: schemas/16-retrieval-response-schema.yaml
acl_decision_schema_ref: schemas/14-acl-decision-schema.yaml

request_contract:
  required_fields:
    - trace_id
    - query
    - identity_context
  optional_fields:
    - filters
    - max_results
  max_query_characters: 2000
  max_results_limit: 20
  identity_required_fields:
    - subject_ref
    - tenant_ref
    - group_refs
    - authenticated_at
    - acl_snapshot_version
  identity_rules:
    anonymous_allowed: false
    plaintext_personal_data_allowed: false
    stale_identity_action: deny_access

permission_checks:
  pre_retrieval:
    required: true
    action: filter_by_source_acl
  pre_document_read:
    required: true
    action: revalidate_source_acl
  pre_answer:
    required: true
    action: validate_all_citations_accessible
  unknown_or_unavailable_acl: deny_access
  deny_precedence: explicit_deny_overrides_allow
  inheritance_source: source_knowledge_base

response_contract:
  required_fields:
    - trace_id
    - status
    - results
    - citations
    - control_plane_version
    - index_generation
  result_required_fields:
    - document_id
    - chunk_id
    - source_version
    - score
    - citation_ref
  citation_required_fields:
    - citation_ref
    - document_id
    - source_url
    - source_version
    - locator
  answer_rules:
    evidence_required: true
    accessible_citation_required: true
    stale_source_allowed: false
    permission_filtered_count_exposed: false
    unauthorized_resource_existence_exposed: false

errors:
  - code: permission_denied
    public_message: 无法访问请求范围内的知识。
    retryable: false
    expose_resource_existence: false
  - code: no_evidence
    public_message: 当前可访问知识中没有足够依据回答。
    retryable: false
    expose_resource_existence: false
  - code: source_stale
    public_message: 知识来源状态需要重新同步，暂不回答。
    retryable: true
    expose_resource_existence: false
  - code: control_invalid
    public_message: 知识控制配置无效，服务已安全停止。
    retryable: false
    expose_resource_existence: false
  - code: service_unavailable
    public_message: 知识检索服务暂时不可用。
    retryable: true
    expose_resource_existence: false
