# 用途：本地 AI、检索服务和校验程序加载知识控制面的唯一机器入口。
# 安全：任一必需文件缺失、版本不兼容或交叉引用失效时必须停止，不得带病降级运行。
$schema: ./schemas/07-ai-control-manifest-schema.yaml
schema_version: "1.0"
control_plane_id: qianli-corpus-ai-control
updated_at: '2026-08-14'
operating_mode: governance_validation
production_index_enabled: false

# 冲突时按从高到低顺序处理。索引副本永远不能反向覆盖源知识或权限。
authority_precedence:
  - source_permissions
  - source_content
  - git_governance_controls
  - runtime_index

failure_policy:
  missing_required_file: deny_startup
  incompatible_schema_major: deny_startup
  invalid_cross_reference: deny_startup
  unknown_control_field: deny_startup
  acl_state_unknown: deny_access
  source_version_stale: deny_answer

# 路径作用域由加载器映射到受控根目录；所有机器引用都禁止绝对路径和父级穿越。
path_policy:
  default_scope: ai_root
  allowed_scopes:
    - ai_root
    - governance_root
  absolute_paths_allowed: false
  parent_traversal_allowed: false

# 运行状态、索引、缓存和查询日志只允许放在 Git 忽略目录中。
runtime_state:
  root: 00-知识库治理与索引/.runtime
  git_tracked: false
  allowed_content:
    - connector_state
    - index_state
    - query_audit
    - evaluation_results
  prohibited_content:
    - plaintext_credentials
    - access_tokens
    - secret_keys

# 数组顺序就是唯一加载顺序；所有登记项均为启动必需文件。
load_sequence:
  - control_id: knowledge_structure
    path: 01-knowledge-structure.yaml
    format: yaml
    validation_schema: schemas/01-knowledge-structure-schema.yaml
    phase: structure
  - control_id: feishu_space_bindings
    path: 03-平台运维/03-feishu-space-bindings.yaml
    path_scope: governance_root
    format: yaml
    validation_schema: 03-平台运维/schemas/03-feishu-space-bindings-schema.yaml
    validation_schema_scope: governance_root
    phase: structure
  - control_id: metadata_schema
    path: schemas/02-metadata-schema.yaml
    format: json_schema
    validation_schema: null
    phase: metadata
  - control_id: controlled_vocabulary_schema
    path: schemas/03-controlled-vocabulary-schema.yaml
    format: json_schema
    validation_schema: null
    phase: vocabulary
  - control_id: document_types
    path: vocabularies/01-document-types.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: security_levels
    path: vocabularies/02-security-levels.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: business_domains
    path: vocabularies/03-business-domains.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: systems_platforms
    path: vocabularies/04-systems-platforms.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: source_systems
    path: vocabularies/05-source-systems.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: retention_policies
    path: vocabularies/06-retention-policies.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
  - control_id: index_admission
    path: 03-index-admission-rules.yaml
    format: yaml
    validation_schema: schemas/12-index-admission-rules-schema.yaml
    phase: admission
  - control_id: admission_decision_schema
    path: schemas/13-admission-decision-schema.yaml
    format: json_schema
    validation_schema: null
    phase: admission
  - control_id: authority_sources
    path: 05-authority-sources.yaml
    format: yaml
    validation_schema: schemas/04-authority-sources-schema.yaml
    phase: authority
  - control_id: corpus_manifest
    path: 06-corpus-manifest.yaml
    format: yaml
    validation_schema: schemas/05-corpus-manifest-schema.yaml
    phase: corpus
  - control_id: indexing_profile_schema
    path: schemas/17-indexing-profile-schema.yaml
    format: json_schema
    validation_schema: null
    phase: indexing
  - control_id: indexing_profile
    path: 03-平台运维/configs/governance-validation-indexing-profile.yaml
    path_scope: governance_root
    format: yaml
    validation_schema: schemas/17-indexing-profile-schema.yaml
    phase: indexing
  - control_id: indexing_policy
    path: 10-indexing-policy.yaml
    format: yaml
    validation_schema: schemas/09-indexing-policy-schema.yaml
    phase: indexing
  - control_id: retrieval_runtime_contract
    path: 09-retrieval-runtime-contract.yaml
    format: yaml
    validation_schema: schemas/08-retrieval-runtime-contract-schema.yaml
    phase: retrieval
  - control_id: acl_decision_schema
    path: schemas/14-acl-decision-schema.yaml
    format: json_schema
    validation_schema: null
    phase: retrieval
  - control_id: retrieval_request_schema
    path: schemas/15-retrieval-request-schema.yaml
    format: json_schema
    validation_schema: null
    phase: retrieval
  - control_id: retrieval_response_schema
    path: schemas/16-retrieval-response-schema.yaml
    format: json_schema
    validation_schema: null
    phase: retrieval
  - control_id: evaluation_cases
    path: 07-evaluation-cases.yaml
    format: yaml
    validation_schema: schemas/06-evaluation-case-schema.yaml
    phase: evaluation
  - control_id: runtime_audit_schema
    path: schemas/10-runtime-audit-event-schema.yaml
    format: json_schema
    validation_schema: null
    phase: audit
  - control_id: evaluation_result_schema
    path: schemas/11-evaluation-result-schema.yaml
    format: json_schema
    validation_schema: null
    phase: evaluation
