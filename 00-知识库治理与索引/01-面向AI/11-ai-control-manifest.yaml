# 用途：本地 AI、检索服务和校验程序加载知识控制面的唯一机器入口。
# 安全：任一必需文件缺失、版本不兼容或交叉引用失效时必须停止，不得带病降级运行。
$schema: ./schemas/07-ai-control-manifest-schema.yaml
schema_version: "1.0"
control_plane_id: qianli-corpus-ai-control
updated_at: '2026-08-14'
operating_mode: governance_validation
production_index_enabled: false

# 冲突时按从高到低顺序处理。索引副本永远不能反向覆盖源知识或权限。
authority_precedence:
  - source_permissions
  - source_content
  - git_governance_controls
  - runtime_index

failure_policy:
  missing_required_file: deny_startup
  incompatible_schema_major: deny_startup
  invalid_cross_reference: deny_startup
  unknown_control_field: deny_startup
  acl_state_unknown: deny_access
  source_version_stale: deny_answer

# 运行状态、索引、缓存和查询日志只允许放在 Git 忽略目录中。
runtime_state:
  root: 00-知识库治理与索引/.runtime
  git_tracked: false
  allowed_content:
    - connector_state
    - index_state
    - query_audit
    - evaluation_results
  prohibited_content:
    - plaintext_credentials
    - access_tokens
    - secret_keys

# priority 数字越小越先加载；同一优先级视为配置错误。
load_sequence:
  - control_id: knowledge_structure
    path: 01-knowledge-structure.yaml
    format: yaml
    validation_schema: schemas/01-knowledge-structure-schema.yaml
    phase: structure
    required: true
    priority: 10
  - control_id: metadata_schema
    path: schemas/02-metadata-schema.yaml
    format: json_schema
    validation_schema: null
    phase: metadata
    required: true
    priority: 20
  - control_id: controlled_vocabulary_schema
    path: schemas/03-controlled-vocabulary-schema.yaml
    format: json_schema
    validation_schema: null
    phase: vocabulary
    required: true
    priority: 30
  - control_id: document_types
    path: vocabularies/01-document-types.yaml
    format: yaml
    validation_schema: schemas/03-controlled-vocabulary-schema.yaml
    phase: vocabulary
    required: true
    priority: 40
  - control_id: security_levels
