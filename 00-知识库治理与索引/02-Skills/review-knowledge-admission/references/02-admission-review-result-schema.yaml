# 用途：定义知识入库审查技能向管理员、其他 Agent 或审计流程交接时的稳定输出格式。
# 兼容标准：JSON Schema Draft 2020-12；YAML 只是便于人员阅读的承载格式。
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:qianli-drive:skill:knowledge-admission-review-result:v1
title: 知识入库审查结果
description: 与 Agent 产品无关的知识准入审查、审批阻塞和管理员交接契约。
type: object
additionalProperties: false
required:
  - schema_version
  - workflow
  - status
  - source
  - governance
  - review_stage
  - machine_checks
  - human_checks
  - approvals
  - admin_actions
  - control_updates
properties:
  schema_version:
    type: string
    const: "1.0"
    description: 本审查结果结构的版本。
  workflow:
    type: string
    const: review-knowledge-admission
    description: 生成结果的标准工作流名称。
  status:
    type: string
    enum:
      - failed
      - blocked
      - ready_for_admin
      - governance_validated
    description: 审查状态；依次表示不通过、阻塞、可提交管理员和治理验证通过。
  source:
    type: object
    additionalProperties: false
    required:
      - locator
      - metadata_locator
    description: 被审文档及其候选元数据定位。
    properties:
      locator:
        type: string
        minLength: 1
        description: 原始待审文件或文档链接。
      metadata_locator:
        type: string
        minLength: 1
        description: 与原始文件一一对应的候选元数据定位。
      content_hash:
        type: string
        description: 可选内容摘要，用于证明审查版本。
  governance:
    type: object
    additionalProperties: false
    required:
      - root
      - operating_mode
      - production_index_enabled
    description: 本次使用的治理规则和全局开关。
    properties:
      root:
        type: string
        minLength: 1
        description: 当前治理项目或治理目录定位。
      operating_mode:
        type: string
        minLength: 1
        description: 审查时读取到的运行模式。
      production_index_enabled:
        type: boolean
        description: 审查时读取到的生产索引开关。
      validator:
        type: string
        description: 使用的机器校验器名称和版本。
  review_stage:
    type: string
    enum:
      - pre_create
      - final
    description: pre_create 为首次创建前审查，final 为已有真实平台字段后的最终审查。
  machine_checks:
    type: array
    description: 元数据、目录、字典和模式的机器检查结果。
    items:
      $ref: '#/$defs/check'
  human_checks:
    type: array
    description: 内容、安全、权威来源和审批证据的审查结果。
    items:
      $ref: '#/$defs/check'
  approvals:
    type: array
    description: 负责人、内容审批、安全审核和管理员确认状态。
    items:
      $ref: '#/$defs/approval'
  admin_actions:
    type: array
    description: 达到管理员交接条件后需要执行的受控操作。
    items:
      $ref: '#/$defs/action'
  control_updates:
    type: array
    description: 控制文件允许、禁止或实际执行的更新记录。
    items:
      $ref: '#/$defs/control_update'
$defs:
  check:
    type: object
    additionalProperties: false
    required:
      - id
      - status
      - message
    properties:
      id:
        type: string
        minLength: 1
        description: 稳定检查规则ID。
      status:
        type: string
        enum:
          - pass
          - fail
          - blocked
          - info
        description: 检查状态；依次表示通过、失败、阻塞和提示。
      message:
        type: string
        minLength: 1
        description: 中文检查结论或整改要求。
      evidence:
        type: array
        description: 支持结论的文件、章节、页码或操作证据定位。
        items:
          type: string
  approval:
    type: object
    additionalProperties: false
    required:
      - role
      - status
    properties:
      role:
        type: string
        minLength: 1
        description: 需要确认的治理或业务角色。
      actor:
        type: string
        description: 已确认时的真实人员标识。
      status:
        type: string
        enum:
          - pending
          - confirmed
          - rejected
        description: 审批状态；依次表示待确认、已确认和已拒绝。
      evidence:
        type: string
        description: 审批记录或来源定位。
  action:
    type: object
    additionalProperties: false
    required:
      - step
      - instruction
      - status
    properties:
      step:
        type: integer
        minimum: 1
        description: 管理员操作顺序。
      instruction:
        type: string
        minLength: 1
        description: 需要管理员执行的中文操作说明。
      status:
        type: string
        enum:
          - not_applicable
          - pending
          - completed
        description: 操作状态；依次表示不适用、待执行和已完成。
      evidence:
        type: string
        description: 完成操作后的真实证据定位。
  control_update:
    type: object
    additionalProperties: false
    required:
      - file
      - allowed
      - status
      - reason
    properties:
      file:
        type: string
        minLength: 1
        description: 控制文件路径或标识。
      allowed:
        type: boolean
        description: 当前场景是否允许该更新。
      status:
        type: string
        enum:
          - prohibited
          - not_required
          - pending_approval
          - updated
        description: 更新状态；依次表示禁止、不需要、待审批和已更新。
      reason:
        type: string
        minLength: 1
        description: 允许、禁止或暂缓更新的中文原因。
      evidence:
        type: string
        description: 实际更新后的差异或审批证据定位。
